<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICHAEL AND CECILIA IBRU UNIVERSITY - Result Sheet</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 850px; border: 1px solid #ccc; }
    
    .student-info { margin-bottom: 20px; line-height: 1.8; }
    .student-info div { font-weight: bold; font-size: 15px; color: #000; }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
    th, td { border: 1px solid #000; padding: 8px 10px; text-align: center; font-size: 13px; }
    th { background-color: #f8f9fa; font-weight: bold; }
    .left-align { text-align: left; }
    .bold { font-weight: bold; }
    
    .gpa-section { text-align: right; font-size: 18px; font-weight: bold; margin-bottom: 25px; }
    .gpa-value { text-decoration: underline; border-bottom: 2px solid #000; padding-bottom: 2px; }

    .btn-action { display: block; width: 100%; padding: 14px; background-color: #1a73e8; color: white; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 15px; border: none; cursor: pointer; margin-bottom: 12px; }
    .btn-action:hover { background-color: #1557b0; }
    .btn-secondary { background-color: #1a73e8; }
    
    @media print {
      body { background-color: #fff; padding: 0; }
      .card { box-shadow: none; border: none; width: 100%; max-width: 100%; }
      .btn-action { display: none; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="resultContainer">Loading...</div>
  </div>

  <script>
    const storedData = sessionStorage.getItem('studentResult');
    const resultContainer = document.getElementById('resultContainer');

    if (storedData) {
      try {
        const result = JSON.parse(storedData);
        
        // Default course list fallback if server returns empty list
        const courses = result.courses && result.courses.length > 0 ? result.courses : [
          { code: 'COS 201 - Introduction to Computer Science', unit: 3, score: 50, grade: 'C', qp: 9 },
          { code: 'CYB 201 - Cybersecurity Fundamentals', unit: 2, score: 76, grade: 'A', qp: 10 },
          { code: 'CYB 203 - Computer System Architecture', unit: 2, score: 73, grade: 'A', qp: 10 },
          { code: 'SEN 201 - Introduction to Software Engineering', unit: 2, score: 51, grade: 'C', qp: 6 },
          { code: 'MCIU-CYB 213 - Network Security I', unit: 2, score: 64, grade: 'B', qp: 8 },
          { code: 'MCIU-CYB 215 - Information Assurance', unit: 2, score: 70, grade: 'A', qp: 10 }
        ];

        let totalUnits = 0;
        let totalQP = 0;

        let rowsHtml = courses.map((c, i) => {
          totalUnits += Number(c.unit || 0);
          totalQP += Number(c.qp || 0);
          return `
            <tr>
              <td>${i + 1}</td>
              <td class="left-align">${c.code || c.courseTitle}</td>
              <td>${c.unit}</td>
              <td>${c.score}</td>
              <td class="bold">${c.grade}</td>
              <td>${c.qp}</td>
            </tr>
          `;
        }).join('');

        resultContainer.innerHTML = `
          <div class="student-info">
            <div>NAME: ${result.studentName || 'NWACHUKWU EMMANUEL CHUKWUEMERIE'}</div>
            <div>MATRIC NO: ${result.matricNumber || 'NS/CB/24/1134'}</div>
          </div>

          <table>
            <thead>
              <tr>
                <th rowspan="2" style="width: 50px;">S/N</th>
                <th rowspan="2">COURSE CODE & TITLE</th>
                <th rowspan="2" style="width: 70px;">UNIT</th>
                <th colspan="2">PERFORMANCE</th>
                <th rowspan="2" style="width: 70px;">QP</th>
              </tr>
              <tr>
                <th style="width: 90px;">SC (Score)</th>
                <th style="width: 90px;">GD (Grade)</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
              <tr class="bold">
                <td colspan="2" style="text-align: right; padding-right: 15px;">TOTALS:</td>
                <td>${totalUnits}</td>
                <td colspan="2"></td>
                <td>${totalQP}</td>
              </tr>
            </tbody>
          </table>

          <div class="gpa-section">
            B.Sc. PROGRAMME GPA: <span class="gpa-value">${result.gpa || (totalQP / (totalUnits || 1)).toFixed(2)}</span>
          </div>

          <button class="btn-action" onclick="window.print()">🖨️ Print Result Sheet</button>
          <a href="/index.html" class="btn-action btn-secondary">Logout Portal</a>
        `;
      } catch (e) {
        resultContainer.innerHTML = `<p style="color:red; text-align:center;">Error rendering result format.</p>`;
      }
    } else {
      resultContainer.innerHTML = `<p style="color:red; text-align:center;">No session found. Please login again.</p>`;
    }
  </script>

</body>
</html>
