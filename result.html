<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICHAEL AND CECILIA IBRU UNIVERSITY - Result Sheet</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; border: 1px solid #ccc; }
    
    .header-title { text-align: center; color: #0056b3; margin-bottom: 25px; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
    .header-title h2 { margin: 0; font-size: 20px; }
    .header-title p { margin: 5px 0 0 0; color: #555; font-size: 14px; }

    .student-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; font-size: 14px; line-height: 1.6; }
    .student-details div { color: #333; }
    .student-details strong { color: #000; }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
    th, td { border: 1px solid #333; padding: 10px; text-align: center; font-size: 14px; }
    th { background-color: #f8f9fa; font-weight: bold; }
    .left-align { text-align: left; }
    
    .summary-section { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 25px; background: #f8f9fa; padding: 12px 18px; border: 1px solid #333; border-radius: 5px; }

    .btn-action { display: block; width: 100%; padding: 12px; background-color: #0066cc; color: white; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 15px; border: none; cursor: pointer; margin-bottom: 10px; }
    .btn-action:hover { background-color: #0052a3; }
    
    @media print {
      body { background-color: #fff; padding: 0; }
      .card { box-shadow: none; border: none; width: 100%; max-width: 100%; }
      .btn-action { display: none; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-title">
      <h2>MICHAEL AND CECILIA IBRU UNIVERSITY</h2>
      <p>Student Academic Result Sheet</p>
    </div>

    <div id="resultContainer">Loading...</div>
  </div>

  <script>
    // Function to calculate Grade Points based on Score (5.0 Scale)
    function getGradePoint(score) {
      const s = Number(score);
      if (s >= 70) return 5;
      if (s >= 60) return 4;
      if (s >= 50) return 3;
      if (s >= 45) return 2;
      if (s >= 40) return 1;
      return 0;
    }

    const storedData = sessionStorage.getItem('studentResult');
    const resultContainer = document.getElementById('resultContainer');

    if (storedData) {
      try {
        const result = JSON.parse(storedData);
        
        // Find course list array or single course object
        const courses = Array.isArray(result.courses) && result.courses.length > 0 
          ? result.courses 
          : (result.courseCode || result.code ? [result] : []);

        let totalUnits = 0;
        let totalQualityPoints = 0;
        let rowsHtml = '';

        if (courses.length > 0) {
          rowsHtml = courses.map((c, i) => {
            const unit = Number(c.creditUnit || c.unit || c.units || 0);
            const score = Number(c.score || 0);
            const gradePoint = getGradePoint(score);
            
            totalUnits += unit;
            totalQualityPoints += (unit * gradePoint);

            return `
              <tr>
                <td>${i + 1}</td>
                <td>${c.courseCode || c.code || 'N/A'}</td>
                <td class="left-align">${c.courseTitle || c.title || c.code || 'N/A'}</td>
                <td>${unit}</td>
                <td>${score}</td>
              </tr>
            `;
          }).join('');
        } else {
          rowsHtml = `<tr><td colspan="5">No course records attached to this result.</td></tr>`;
        }

        // Calculate GPA automatically
        const calculatedGPA = totalUnits > 0 ? (totalQualityPoints / totalUnits).toFixed(2) : '0.00';
        
        // Display GPA & CGPA (Uses DB value if provided, else calculated GPA)
        const displayGPA = result.gpa !== undefined && result.gpa !== null ? result.gpa : calculatedGPA;
        const displayCGPA = result.cgpa !== undefined && result.cgpa !== null ? result.cgpa : displayGPA;

        // Extract student name dynamically across multiple common DB key names
        const studentFullName = result.studentName || result.fullName || result.name || result.student_name || 'Student';

        resultContainer.innerHTML = `
          <div class="student-details">
            <div><strong>Student Full Name:</strong> ${studentFullName}</div>
            <div><strong>Matric Number:</strong> ${result.matricNumber || 'N/A'}</div>
            <div><strong>Academic Session:</strong> ${result.session || 'N/A'}</div>
            <div><strong>Semester:</strong> ${result.semester || 'N/A'}</div>
          </div>

          <table>
            <thead>
              <tr>
                <th style="width: 50px;">S/N</th>
                <th style="width: 130px;">Course Code</th>
                <th>Course Title</th>
                <th style="width: 100px;">Credit Unit</th>
                <th style="width: 80px;">Score</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>

          <div class="summary-section">
            <span>GPA: ${displayGPA}</span>
            <span>CGPA: ${displayCGPA}</span>
          </div>

          <button class="btn-action" onclick="window.print()">🖨️ Print Result Sheet</button>
          <a href="/index.html" class="btn-action">Logout Portal</a>
        `;
      } catch (e) {
        resultContainer.innerHTML = `<p style="color:red; text-align:center;">Error parsing result payload.</p>`;
      }
    } else {
      resultContainer.innerHTML = `<p style="color:red; text-align:center;">No active session found. Please login from the main portal.</p>`;
    }
  </script>

</body>
</html>
