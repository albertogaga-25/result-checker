<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICHAEL AND CECILIA IBRU UNIVERSITY - Result Sheet</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; border: 1px solid #ccc; }
    
    .header-title { text-align: center; color: #0056b3; margin-bottom: 25px; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
    .header-title h2 { margin: 0; font-size: 20px; }
    .header-title p { margin: 5px 0 0 0; color: #555; font-size: 14px; }

    .student-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; font-size: 14px; line-height: 1.6; }
    .student-details div { color: #333; }
    .student-details strong { color: #000; }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
    th, td { border: 1px solid #333; padding: 10px; text-align: center; font-size: 14px; }
    th { background-color: #f8f9fa; font-weight: bold; }
    .left-align { text-align: left; }
    
    .summary-section { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 25px; background: #f8f9fa; padding: 12px 18px; border: 1px solid #333; border-radius: 5px; }

    .btn-action { display: block; width: 100%; padding: 12px; background-color: #0066cc; color: white; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 15px; border: none; cursor: pointer; margin-bottom: 10px; }
    .btn-action:hover { background-color: #0052a3; }
    
    @media print {
      body { background-color: #fff; padding: 0; }
      .card { box-shadow: none; border: none; width: 100%; max-width: 100%; }
      .btn-action { display: none; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-title">
      <h2>MICHAEL AND CECILIA IBRU UNIVERSITY</h2>
      <p>Student Academic Result Sheet</p>
    </div>

    <div id="resultContainer">Loading...</div>
  </div>

  <script>
    // Helper to extract grade point (5.0 scale)
    function calcPoints(s) {
      const num = parseFloat(s);
      if (isNaN(num)) return 0;
      if (num >= 70) return 5;
      if (num >= 60) return 4;
      if (num >= 50) return 3;
      if (num >= 45) return 2;
      if (num >= 40) return 1;
      return 0;
    }

    const storedData = sessionStorage.getItem('studentResult');
    const resultContainer = document.getElementById('resultContainer');

    if (storedData) {
      try {
        const result = JSON.parse(storedData);
        
        // Find course items list
        let courseList = [];
        if (Array.isArray(result.courses) && result.courses.length > 0) {
          courseList = result.courses;
        } else if (Array.isArray(result.results) && result.results.length > 0) {
          courseList = result.results;
        } else {
          // Single record object
          courseList = [result];
        }

        let totalUnits = 0;
        let totalPoints = 0;
        let rowsHtml = '';

        courseList.forEach((c, index) => {
          // Extract fields with fallbacks
          const code = c.courseCode || c.code || c.course || 'IT';
          const title = c.courseTitle || c.title || c.description || 'SIWES';
          
          // Parse unit & score as numbers safely
          const rawUnit = c.creditUnit ?? c.unit ?? c.units ?? 0;
          const rawScore = c.score ?? c.marks ?? c.sc ?? 0;
          
          const unit = parseFloat(rawUnit) || 0;
          const score = parseFloat(rawScore) || 0;

          const points = calcPoints(score);

          totalUnits += unit;
          totalPoints += (unit * points);

          rowsHtml += `
            <tr>
              <td>${index + 1}</td>
              <td>${code}</td>
              <td class="left-align">${title}</td>
              <td>${unit}</td>
              <td>${score}</td>
            </tr>
          `;
        });

        // Compute GPA
        const calculatedGPA = totalUnits > 0 ? (totalPoints / totalUnits).toFixed(2) : '0.00';
        
        // Final display values
        const finalGPA = (result.gpa !== undefined && result.gpa !== null && result.gpa !== 'N/A') ? result.gpa : calculatedGPA;
        const finalCGPA = (result.cgpa !== undefined && result.cgpa !== null && result.cgpa !== 'N/A') ? result.cgpa : finalGPA;

        // Student name check across all possibilities
        const name = result.studentName || result.fullName || result.name || result.student_name || result.student || 'N/A';

        resultContainer.innerHTML = `
          <div class="student-details">
            <div><strong>Student Full Name:</strong> ${name}</div>
            <div><strong>Matric Number:</strong> ${result.matricNumber || result.matricNo || 'N/A'}</div>
            <div><strong>Academic Session:</strong> ${result.session || 'N/A'}</div>
            <div><strong>Semester:</strong> ${result.semester || 'N/A'}</div>
          </div>

          <table>
            <thead>
              <tr>
                <th style="width: 50px;">S/N</th>
                <th style="width: 130px;">Course Code</th>
                <th>Course Title</th>
                <th style="width: 100px;">Credit Unit</th>
                <th style="width: 80px;">Score</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>

          <div class="summary-section">
            <span>GPA: ${finalGPA}</span>
            <span>CGPA: ${finalCGPA}</span>
          </div>

          <button class="btn-action" onclick="window.print()">🖨️ Print Result Sheet</button>
          <a href="/index.html" class="btn-action">Logout Portal</a>
        `;
      } catch (err) {
        console.error(err);
        resultContainer.innerHTML = `<p style="color:red; text-align:center;">Error rendering result table.</p>`;
      }
    } else {
      resultContainer.innerHTML = `<p style="color:red; text-align:center;">No session found. Please login again.</p>`;
    }
  </script>

</body>
</html>
