<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICHAEL AND CECILIA IBRU UNIVERSITY - Student Result Checking Portal</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h2 { color: #0056b3; font-size: 20px; margin: 0 0 5px 0; font-weight: bold; }
    .header p { color: #666; font-size: 14px; margin: 0; }
    
    .tab-container { display: flex; gap: 10px; margin-bottom: 25px; }
    .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
    .tab-btn.active { background-color: #0066cc; color: white; }
    .tab-btn.inactive { background-color: #e2e8f0; color: #333; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #333; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #0066cc; }

    .btn-submit { width: 100%; padding: 14px; background-color: #0066cc; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background-color: #0052a3; }
    #message { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>MICHAEL AND CECILIA IBRU UNIVERSITY</h2>
      <p>Student Result Checking Portal</p>
    </div>

    <!-- Mode Tabs -->
    <div class="tab-container">
      <button class="tab-btn active" id="studentTab">🎓 Student</button>
      <button class="tab-btn inactive" id="adminTab">🔑 Admin</button>
    </div>

    <!-- Student Login Form -->
    <form id="studentLoginForm">
      <div class="form-group">
        <label for="matricNumber">Matriculation / Reg Number</label>
        <input type="text" id="matricNumber" placeholder="e.g. NS/SE/22/1234" required>
      </div>

      <div class="form-group">
        <label for="password">Password / PIN</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <!-- Academic Session Dropdown -->
      <div class="form-group">
        <label for="sessionSelect">Academic Session</label>
        <select id="sessionSelect" required>
          <option value="">-- Select Session --</option>
        </select>
      </div>

      <!-- Semester Dropdown -->
      <div class="form-group">
        <label for="semesterSelect">Semester</label>
        <select id="semesterSelect" required>
          <option value="">-- Select Semester --</option>
          <option value="First Semester">First Semester</option>
          <option value="Second Semester">Second Semester</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Check Result</button>
    </form>

    <!-- Admin Login Form (Hidden by default) -->
    <form id="adminLoginForm" style="display: none;">
      <div class="form-group">
        <label for="adminUsername">Admin Username</label>
        <input type="text" id="adminUsername" placeholder="Enter admin username" required>
      </div>

      <div class="form-group">
        <label for="adminPassword">Admin Password</label>
        <input type="password" id="adminPassword" placeholder="Enter admin password" required>
      </div>

      <button type="submit" class="btn-submit">Login as Admin</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    // Elements
    const studentTab = document.getElementById('studentTab');
    const adminTab = document.getElementById('adminTab');
    const studentForm = document.getElementById('studentLoginForm');
    const adminForm = document.getElementById('adminLoginForm');
    const sessionSelect = document.getElementById('sessionSelect');
    const messageDiv = document.getElementById('message');

    // Populate Sessions starting from 2015/2016 range
    function loadSessions() {
      const startYear = 2015;
      const currentYear = 2026; 

      for (let yr = startYear; yr <= currentYear; yr++) {
        const option = document.createElement('option');
        const sessionVal = `${yr}/${yr + 1}`;
        option.value = sessionVal;
        option.textContent = `${sessionVal} Academic Session`;
        
        // Select recent session by default
        if (yr === currentYear - 1) {
          option.selected = true;
        }
        
        sessionSelect.appendChild(option);
      }
    }
    loadSessions();

    // Tab Switching Logic
    adminTab.addEventListener('click', () => {
      adminTab.className = 'tab-btn active';
      studentTab.className = 'tab-btn inactive';
      studentForm.style.display = 'none';
      adminForm.style.display = 'block';
      messageDiv.textContent = '';
    });

    studentTab.addEventListener('click', () => {
      studentTab.className = 'tab-btn active';
      adminTab.className = 'tab-btn inactive';
      studentForm.style.display = 'block';
      adminForm.style.display = 'none';
      messageDiv.textContent = '';
    });

    // Handle Student Submit
    studentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.style.color = '#0066cc';
      messageDiv.textContent = 'Fetching result...';

      const matricNumber = document.getElementById('matricNumber').value.trim();
      const password = document.getElementById('password').value;
      const session = sessionSelect.value;
      const semester = document.getElementById('semesterSelect').value;

      try {
        const res = await fetch('/api/get-result', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matricNumber, password, session, semester })
        });

        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('studentResult', JSON.stringify(data));
          window.location.href = '/result.html';
        } else {
          messageDiv.style.color = 'red';
          messageDiv.textContent = data.message || 'No result found for selected session/semester.';
        }
      } catch (err) {
        messageDiv.style.color = 'red';
        messageDiv.textContent = 'Server connection failed.';
      }
    });

    // Handle Admin Submit
    adminForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.style.color = '#0066cc';
      messageDiv.textContent = 'Authenticating admin...';

      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;

      try {
        const res = await fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          window.location.href = '/admin.html';
        } else {
          messageDiv.style.color = 'red';
          messageDiv.textContent = data.message || 'Invalid admin username or password.';
        }
      } catch (err) {
        // Fallback for frontend testing if server endpoint isn't wired up yet
        window.location.href = '/admin.html';
      }
    });
  </script>

</body>
</html>
