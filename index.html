<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael and Cecilia Ibru University - Portal Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-container" style="max-width: 500px; margin: 40px auto; padding: 25px; border: 1px solid #ccc; border-radius: 8px; background: #fff;">
        <div class="logo-header" style="text-align: center; margin-bottom: 20px;">
            <h2 style="margin-bottom: 5px; color: #0066cc;">MICHAEL AND CECILIA IBRU UNIVERSITY</h2>
            <p style="color: #666; margin: 0;">Portal Gateway</p>
        </div>

        <!-- Role Selector Buttons -->
        <div class="role-selector" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button type="button" id="btnStudentRole" style="flex: 1; padding: 12px; background-color: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                🎓 Student
            </button>
            <button type="button" id="btnAdminRole" style="flex: 1; padding: 12px; background-color: #e0e0e0; color: #333; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                🔑 Admin
            </button>
        </div>

        <!-- STUDENT FORM -->
        <form id="studentLoginForm">
            <div class="form-group" style="margin-bottom: 12px;">
                <label for="loginMatric">Matriculation / Reg Number</label>
                <input type="text" id="loginMatric" placeholder="e.g. NS/SE/22/1234" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label for="loginPassword">Password / PIN</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label for="loginSession">Academic Session</label>
                <select id="loginSession" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" required>
                    <option value="2025/2026" selected>2025/2026 Academic Session</option>
                    <option value="2024/2025">2024/2025 Academic Session</option>
                    <option value="2023/2024">2023/2024 Academic Session</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="loginTerm">Semester</label>
                <select id="loginTerm" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" required>
                    <option value="FIRST SEMESTER">First Semester</option>
                    <option value="SECOND SEMESTER">Second Semester</option>
                </select>
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background-color: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;">
                Check Result
            </button>
        </form>

        <!-- ADMIN FORM (Hidden by default) -->
        <form id="adminLoginForm" style="display: none;">
            <div class="form-group" style="margin-bottom: 12px;">
                <label for="adminUsername">Admin Username</label>
                <input type="text" id="adminUsername" placeholder="Enter admin username" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="adminPassword">Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password" style="width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background-color: #000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;">
                Login as Admin
            </button>
        </form>

        <p id="loginErrorMessage" style="color: #dc2626; font-weight: bold; text-align: center; margin-top: 15px;"></p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
