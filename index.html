<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael and Cecilia Ibru University - Portal Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { width: 100%; max-width: 450px; background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #ccc; }
        h2 { color: #0066cc; text-align: center; font-size: 18px; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tabs button { flex: 1; padding: 10px; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        #tabStudent { background: #0066cc; color: white; }
        #tabAdmin { background: #e0e0e0; color: #333; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .field input, .field select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { width: 100%; padding: 12px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
        .btn-blue { background: #0066cc; }
        .btn-black { background: #000; }
    </style>
</head>
<body>
    <div class="box">
        <h2>MICHAEL AND CECILIA IBRU UNIVERSITY</h2>
        <p class="sub">Student Result Checking Portal</p>

        <!-- Mode Buttons -->
        <div class="tabs">
            <button type="button" id="tabStudent" onclick="switchMode('student')">🎓 Student</button>
            <button type="button" id="tabAdmin" onclick="switchMode('admin')">🔑 Admin</button>
        </div>

        <!-- Student Login -->
        <form id="formStudent" onsubmit="goStudent(event)">
            <div class="field">
                <label>Matriculation / Reg Number</label>
                <input type="text" placeholder="e.g. NS/SE/22/1234" required>
            </div>
            <div class="field">
                <label>Password / PIN</label>
                <input type="password" placeholder="Enter password" required>
            </div>
            <div class="field">
                <label>Academic Session</label>
                <select>
                    <option>2025/2026 Academic Session</option>
                    <option>2024/2025 Academic Session</option>
                </select>
            </div>
            <div class="field">
                <label>Semester</label>
                <select>
                    <option>First Semester</option>
                    <option>Second Semester</option>
                </select>
            </div>
            <button type="submit" class="btn-submit btn-blue">Check Result</button>
        </form>

        <!-- Admin Login -->
        <form id="formAdmin" style="display: none;" onsubmit="goAdmin(event)">
            <div class="field">
                <label>Admin Username</label>
                <input type="text" placeholder="Enter admin username" required>
            </div>
            <div class="field">
                <label>Admin Password</label>
                <input type="password" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="btn-submit btn-black">Login as Admin</button>
        </form>
    </div>

    <script>
        function switchMode(mode) {
            const fStudent = document.getElementById('formStudent');
            const fAdmin = document.getElementById('formAdmin');
            const tStudent = document.getElementById('tabStudent');
            const tAdmin = document.getElementById('tabAdmin');

            if (mode === 'student') {
                fStudent.style.display = 'block';
                fAdmin.style.display = 'none';
                tStudent.style.backgroundColor = '#0066cc';
                tStudent.style.color = '#ffffff';
                tAdmin.style.backgroundColor = '#e0e0e0';
                tAdmin.style.color = '#333333';
            } else {
                fStudent.style.display = 'none';
                fAdmin.style.display = 'block';
                tAdmin.style.backgroundColor = '#000000';
                tAdmin.style.color = '#ffffff';
                tStudent.style.backgroundColor = '#e0e0e0';
                tStudent.style.color = '#333333';
            }
        }

        function goStudent(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        }

        function goAdmin(e) {
            e.preventDefault();
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
