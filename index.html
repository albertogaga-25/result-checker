<!DOCTYPE html>
<html>
<head>
    <title>University Login</title>
    <!-- We are telling the HTML to look inside the css folder for styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-box">
    <h2>Result Portal</h2>
    
    <select id="roleInput" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ddd;">
        <option value="student">Student</option>
        <option value="admin">Admin</option>
    </select>

    <input type="text" id="matricInput" placeholder="Matric No or Admin Username">
    <input type="password" id="passInput" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error" style="color: red;"></p>
</div>

    <!-- Linking our logic files -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
