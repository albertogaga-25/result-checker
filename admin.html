<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCIU Admin Panel - Upload Results</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-center-wrapper">
        
        <div class="container" style="max-width: 650px; width: 100%; margin: 20px 0;">
            <h2 style="text-align: center; color: #000; margin-bottom: 5px;">MCIU Admin Portal</h2>
            <p style="text-align: center; color: #666; margin-bottom: 25px;">Upload Student Semester Records</p>
            
            <form id="studentForm" onsubmit="addStudent(event)">
                <h3>Student Profile</h3>
                <input type="text" id="newName" placeholder="Student Full Name (e.g., OGHENEOGAGA ALBERT)" required>
                <input type="text" id="newMatric" placeholder="Matric Number (e.g., NS/CB/24/1134)" required>
                <input type="password" id="newPass" placeholder="Set Portal Password" required>

                <!-- Academic Session & Semester Selection -->
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <div style="flex: 1;">
                        <input type="text" id="newSession" placeholder="Academic Session (e.g., 2025/2026)" value="2025/2026" required>
                    </div>
                    <div style="flex: 1;">
                        <select id="newTerm" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
                            <option value="FIRST SEMESTER">First Semester</option>
                            <option value="SECOND SEMESTER">Second Semester</option>
                        </select>
                    </div>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

                <div id="coursesContainer">
                    <div class="course-input-group">
                        <h4 class="course-count-label">Course 1 Details</h4>
                        <input type="text" class="cCode" placeholder="Course Code (e.g., COS 201)" required>
                        <input type="text" class="cTitle" placeholder="Course Title" required>
                        <input type="number" class="cUnit" placeholder="Credit Units" min="1" max="6" required>
                        <input type="number" class="cScore" placeholder="Score (0 - 100)" min="0" max="100" required>
                    </div>
                </div>

                <button type="button" onclick="addNewCourseInput()" style="background-color: #34a853; color: white; margin-bottom: 15px;">➕ Add Another Course</button>
                <button type="submit" style="background-color: #000; color: #fff;">Save Student Record</button>
            </form>
            
            <p id="successMessage" style="color: green; font-weight: bold; text-align: center; margin-top: 15px;"></p>
            <p id="adminErrorMessage" style="color: #dc2626; font-weight: bold; text-align: center; margin-top: 15px;"></p>
            
            <button onclick="adminLogout()" class="btn-logout" style="margin-top: 20px; background-color: #d93025; width: 100%;">Logout Admin</button>
        </div>

        <div class="container wide-container" style="max-width: 950px; width: 100%; margin: 20px 0;">
            <h3 style="margin-bottom: 15px; color: #000; text-align: center; border-bottom: 2px solid #000; padding-bottom: 8px;">📊 REGISTERED STUDENT MASTER DIRECTORY</h3>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse;" id="adminDirectoryTable">
                    <thead>
                        <tr style="background-color: #f4f6f9;">
                            <th style="border: 1px solid #000; padding: 10px; font-weight: bold;">S/N</th>
                            <th style="border: 1px solid #000; padding: 10px; font-weight: bold; text-align: left;">STUDENT NAME</th>
                            <th style="border: 1px solid #000; padding: 10px; font-weight: bold;">MATRIC NO</th>
                            <th style="border: 1px solid #000; padding: 10px; font-weight: bold;">COURSES TAKEN</th>
                            <th style="border: 1px solid #000; padding: 10px; font-weight: bold;">CURRENT GPA</th>
                            <th style="border: 1px solid #000; padding: 10px; font-weight: bold;">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="directoryTableBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
