<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCIU Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #fff; padding: 25px; border-radius: 8px; width: 100%; max-width: 650px; border: 1px solid #ccc; margin-bottom: 20px; }
        h2 { text-align: center; margin-bottom: 5px; }
        p { text-align: center; color: #666; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-green { background: #34a853; color: white; }
        .btn-black { background: #000; color: white; }
        .btn-red { background: #d93025; color: white; margin-top: 15px; }
        .course-box { background: #f8fafc; padding: 15px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>MCIU Admin Portal</h2>
        <p>Upload Student Semester Records</p>

        <form onsubmit="saveData(event)">
            <h3>Student Details</h3>
            <input type="text" placeholder="Student Full Name" required>
            <input type="text" placeholder="Matric Number (e.g. NS/CB/24/1134)" required>
            <input type="password" placeholder="Portal Password" required>

            <div id="courseList">
                <div class="course-box">
                    <h4>Course 1</h4>
                    <input type="text" placeholder="Course Code (e.g. COS 201)" required>
                    <input type="text" placeholder="Course Title" required>
                    <input type="number" placeholder="Credit Units" required>
                    <input type="number" placeholder="Score (0-100)" required>
                </div>
            </div>

            <button type="button" class="btn-green" onclick="addCourse()">➕ Add Another Course</button>
            <button type="submit" class="btn-black">Save Student Record</button>
        </form>

        <p id="msg" style="color: green; text-align: center; font-weight: bold; margin-top: 10px;"></p>
        <button class="btn-red" onclick="window.location.href='index.html'">Logout Admin</button>
    </div>

    <script>
        let count = 1;
        function addCourse() {
            count++;
            const div = document.createElement('div');
            div.className = 'course-box';
            div.innerHTML = `
                <h4>Course ${count}</h4>
                <input type="text" placeholder="Course Code" required>
                <input type="text" placeholder="Course Title" required>
                <input type="number" placeholder="Credit Units" required>
                <input type="number" placeholder="Score (0-100)" required>
            `;
            document.getElementById('courseList').appendChild(div);
        }

        function saveData(e) {
            e.preventDefault();
            document.getElementById('msg').innerText = "Record saved successfully!";
            setTimeout(() => { document.getElementById('msg').innerText = ""; }, 3000);
        }
    </script>
</body>
</html>
