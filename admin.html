<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCIU Admin Portal</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .container { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
    h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
    .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #222; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #444; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #007bff; }
    
    /* Flex layout for Session input and + button */
    .inline-input-group { display: flex; gap: 8px; }
    .btn-inline-add { width: 45px; height: 45px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 20px; font-weight: bold; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .btn-inline-add:hover { background-color: #0056b3; }

    .course-card { background: #fdfdfd; border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .btn-add { background-color: #28a745; color: white; }
    .btn-save { background-color: #000000; color: white; }
    .btn-logout { background-color: #dc3545; color: white; }
    .btn:hover { opacity: 0.9; }
    #message { text-align: center; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>MCIU Admin Portal</h2>
    <p class="subtitle">Upload Student Semester Records</p>

    <form id="resultForm">
      <!-- Student Details Section -->
      <div class="section-title">Student Details</div>
      
      <div class="form-group">
        <label for="fullName">Student Full Name</label>
        <input type="text" id="fullName" placeholder="Student Full Name" required>
      </div>

      <div class="form-group">
        <label for="matricNumber">Matric Number</label>
        <input type="text" id="matricNumber" placeholder="Matric Number (e.g. NS/CB/24/1134)" required>
      </div>

      <div class="form-group">
        <label for="portalPassword">Portal Password</label>
        <input type="password" id="portalPassword" placeholder="Portal Password" required>
      </div>

      <!-- Academic Session Dropdown with + Button -->
      <div class="form-group">
        <label for="sessionSelect">Academic Session</label>
        <div class="inline-input-group">
          <select id="sessionSelect" required>
            <option value="">-- Select Session --</option>
          </select>
          <button type="button" class="btn-inline-add" id="addSessionBtn" title="Add Next Session">+</button>
        </div>
      </div>

      <!-- Semester Dropdown -->
      <div class="form-group">
        <label for="semesterSelect">Semester</label>
        <select id="semesterSelect" required>
          <option value="">-- Select Semester --</option>
          <option value="First Semester">First Semester</option>
          <option value="Second Semester">Second Semester</option>
        </select>
      </div>

      <!-- Courses Section -->
      <div id="coursesContainer">
        <div class="course-card">
          <div class="section-title">Course 1</div>
          
          <div class="form-group">
            <input type="text" class="course-code" placeholder="Course Code (e.g. COS 201)" required>
          </div>
          <div class="form-group">
            <input type="text" class="course-title" placeholder="Course Title" required>
          </div>
          <div class="form-group">
            <input type="number" class="credit-units" placeholder="Credit Units" min="1" max="10" required>
          </div>
          <div class="form-group">
            <input type="number" class="course-score" placeholder="Score (0-100)" min="0" max="100" required>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <button type="button" class="btn btn-add" id="addCourseBtn">+ Add Another Course</button>
      <button type="submit" class="btn btn-save">Save Student Record</button>
      <button type="button" class="btn btn-logout" id="logoutBtn">Logout Admin</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const sessionSelect = document.getElementById('sessionSelect');
    let lastStartYear = 2015;

    // Populate Sessions starting from 2015/2016 up to 2026/2027
    function initSessions() {
      const currentYear = 2026;
      for (let year = 2015; year <= currentYear; year++) {
        addSessionOption(year);
      }
    }

    // Helper to add session option to dropdown
    function addSessionOption(startYear) {
      const endYear = startYear + 1;
      const sessionText = `${startYear}/${endYear} Academic Session`;
      const option = document.createElement('option');
      option.value = `${startYear}/${endYear}`;
      option.textContent = sessionText;
      sessionSelect.appendChild(option);
      lastStartYear = startYear;
    }

    // Handle '+' button to append the next session year automatically
    document.getElementById('addSessionBtn').addEventListener('click', () => {
      const nextStartYear = lastStartYear + 1;
      addSessionOption(nextStartYear);
      sessionSelect.value = `${nextStartYear}/${nextStartYear + 1}`; // Auto-select the newly added session
    });

    // Initialize session options on load
    initSessions();

    // Dynamically Add New Course Form Block
    let courseCount = 1;
    document.getElementById('addCourseBtn').addEventListener('click', () => {
      courseCount++;
      const container = document.getElementById('coursesContainer');
      const courseCard = document.createElement('div');
      courseCard.className = 'course-card';
      courseCard.innerHTML = `
        <div class="section-title">Course ${courseCount}</div>
        <div class="form-group">
          <input type="text" class="course-code" placeholder="Course Code (e.g. COS 201)" required>
        </div>
        <div class="form-group">
          <input type="text" class="course-title" placeholder="Course Title" required>
        </div>
        <div class="form-group">
          <input type="number" class="credit-units" placeholder="Credit Units" min="1" max="10" required>
        </div>
        <div class="form-group">
          <input type="number" class="course-score" placeholder="Score (0-100)" min="0" max="100" required>
        </div>
      `;
      container.appendChild(courseCard);
    });

    // Handle Form Submit
    document.getElementById('resultForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageDiv = document.getElementById('message');
      messageDiv.style.color = '#007bff';
      messageDiv.textContent = 'Saving record...';

      const fullName = document.getElementById('fullName').value.trim();
      const matricNumber = document.getElementById('matricNumber').value.trim();
      const portalPassword = document.getElementById('portalPassword').value;
      const session = sessionSelect.value;
      const semester = document.getElementById('semesterSelect').value;

      const courseCards = document.querySelectorAll('.course-card');
      const courses = [];

      courseCards.forEach(card => {
        courses.push({
          code: card.querySelector('.course-code').value.trim(),
          title: card.querySelector('.course-title').value.trim(),
          units: Number(card.querySelector('.credit-units').value),
          score: Number(card.querySelector('.course-score').value)
        });
      });

      const payload = { fullName, matricNumber, portalPassword, session, semester, courses };

      try {
        const res = await fetch('/api/save-result', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          messageDiv.style.color = 'green';
          messageDiv.textContent = 'Record saved successfully!';
          document.getElementById('resultForm').reset();
        } else {
          messageDiv.style.color = 'red';
          messageDiv.textContent = data.message || 'Failed to save record.';
        }
      } catch (err) {
        messageDiv.style.color = 'red';
        messageDiv.textContent = 'Network error or server unavailable.';
      }
    });

    // Logout Action
    document.getElementById('logoutBtn').addEventListener('click', () => {
      window.location.href = '/index.html';
    });
  </script>

</body>
</html>
